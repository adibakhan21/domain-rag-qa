# End-to-end RAG configuration.
#
# Retrieval defaults to hybrid + cross-encoder reranking: it has the best point
# estimate on every retrieval metric. Note the measured caveat in the README --
# BM25 + reranking is statistically indistinguishable from it (hit@1 +0.011,
# p = 0.069) and ~63 ms/query cheaper, so it is the better choice if latency
# matters more than the last fraction of a point.
experiment:
  name: rag-evaluation
  tracking_uri: sqlite:///mlflow.db
  experiment_name: domain-rag-qa
  seed: 42

data:
  dataset_name: deepset/covid_qa_deepset
  split: train
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42
  max_documents: null

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_size: 100
  strategy: sentence

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 64
  normalize: true
  device: null
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""

retrieval:
  method: hybrid
  top_k: 5                 # 5 chunks ~= 5k chars, trimmed to max_context_chars below
  candidate_k: 50
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 64
  top_k: 5
  device: null

generation:
  reader_type: extractive        # COVID-QA answers are annotated spans
  extractive_model: deepset/roberta-base-squad2
  generative_model: google/flan-t5-base
  adapter_path: null             # set by scripts/evaluate_rag.py for the LoRA system
  max_context_chars: 4000
  max_answer_tokens: 64
  max_input_tokens: 512
  num_beams: 1
  device: null

evaluation:
  recall_at_k: [1, 3, 5, 10, 20]
  ndcg_at_k: 10
  mrr_at_k: 10
  max_eval_questions: null
  n_bootstrap: 1000
