# Retrieval experiment configuration.
# Every field here is logged to MLflow and copied beside each result file.

experiment:
  name: retrieval-comparison
  tracking_uri: sqlite:///mlflow.db
  experiment_name: domain-rag-qa
  seed: 42

data:
  dataset_name: deepset/covid_qa_deepset
  split: train
  # Document-level splits: two questions on the same paper never straddle the
  # train/test boundary (see src/rag_system/data/covidqa.py).
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42
  max_documents: null

chunking:
  # 1000 chars ~= 250 tokens, comfortably inside the 512-token window of both
  # the embedder and the cross-encoder. Swept in the chunking ablation.
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_size: 100
  strategy: sentence

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 64
  normalize: true          # required for IndexFlatIP to equal cosine similarity
  device: null             # auto: mps > cuda > cpu
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""

retrieval:
  method: hybrid
  top_k: 10
  candidate_k: 50          # first-stage depth; hard ceiling on what reranking can recover
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 64
  top_k: 10
  device: null

evaluation:
  recall_at_k: [1, 3, 5, 10, 20]
  ndcg_at_k: 10
  mrr_at_k: 10
  max_eval_questions: null
  n_bootstrap: 1000
